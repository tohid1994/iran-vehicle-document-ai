services:
  reader:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      IVDAI_API_KEY: ${IVDAI_API_KEY:?Set IVDAI_API_KEY before starting}
